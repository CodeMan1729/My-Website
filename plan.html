<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日计划 - Xiyao Guo</title>
<link rel="icon" href="favicon.ico">
<style>
  :root{
    --bg:#12141a; --card:#1c1f28; --border:#2a2e3a;
    --text:#e8e9ed; --dim:#8b8f9c;
    --ok:#3ddc84; --warn:#ffb454; --bad:#ff5f5f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; padding:20px 16px; min-height:100vh;
    background:var(--bg); color:var(--text);
    font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  }

  /* Password overlay */
  #authOverlay {
    position:fixed; inset:0; z-index:9999;
    background:rgba(10,10,20,0.98);
    display:flex; align-items:center; justify-content:center;
    backdrop-filter:blur(8px);
  }
  #authOverlay.hidden { display:none; }

  .auth-box {
    background:var(--card); border:1px solid var(--border);
    border-radius:16px; padding:32px 28px; max-width:360px; width:90%;
    box-shadow:0 8px 32px rgba(0,0,0,0.4);
  }
  .auth-box h2 { margin:0 0 24px; font-size:22px; text-align:center; }
  .auth-box input {
    width:100%; padding:12px 14px; font-size:15px;
    background:var(--bg); border:1px solid var(--border);
    border-radius:8px; color:var(--text); outline:none;
    transition:border-color 0.2s;
  }
  .auth-box input:focus { border-color:var(--ok); }
  .auth-box button {
    width:100%; margin-top:16px; padding:12px;
    background:var(--ok); border:none; border-radius:8px;
    color:#fff; font-size:15px; font-weight:600; cursor:pointer;
    transition:opacity 0.2s;
  }
  .auth-box button:hover { opacity:0.9; }
  .auth-error {
    margin-top:12px; padding:10px; background:rgba(255,95,95,0.15);
    border:1px solid var(--bad); border-radius:6px;
    color:var(--bad); font-size:13px; text-align:center;
    display:none;
  }
  .auth-error.show { display:block; }

  /* Main content */
  #mainContent { display:none; }
  #mainContent.show { display:block; }

  .wrap{max-width:700px; margin:0 auto;}
  header h1{font-size:24px; margin:0 0 4px;}
  header .sub{color:var(--dim); font-size:13px; margin-bottom:24px;}
  header .back-link {
    display:inline-flex; align-items:center; gap:4px;
    margin-bottom:16px; padding:6px 12px;
    background:var(--card); border:1px solid var(--border);
    border-radius:8px; color:var(--dim);
    text-decoration:none; font-size:14px;
    transition:background 0.2s, color 0.2s;
  }
  header .back-link:hover { background:var(--border); color:var(--text); }

  .plan-list {
    display:flex; flex-direction:column; gap:12px;
  }

  .plan-item {
    display:block; text-decoration:none;
    background:var(--card); border:1px solid var(--border);
    border-radius:10px; padding:16px 20px;
    transition:background 0.2s, border-color 0.2s, transform 0.2s;
    border-left:3px solid transparent;
  }
  .plan-item:hover {
    background:var(--border); border-left-color:var(--ok);
    transform:translateX(4px);
  }

  .plan-date {
    font-size:18px; font-weight:600; color:var(--text);
    margin-bottom:6px;
  }
  .plan-summary {
    font-size:13px; color:var(--dim); line-height:1.5;
  }

  footer{margin-top:32px; font-size:11px; color:var(--dim); text-align:center;}

  @media (max-width: 600px) {
    body { padding:16px 12px; }
    header h1 { font-size:20px; }
    .plan-date { font-size:16px; }
    .plan-summary { font-size:12px; }
  }
</style>
</head>
<body>

<!-- Password Authentication -->
<div id="authOverlay">
  <div class="auth-box">
    <h2>🔒</h2>
    <input type="password" id="passwordInput" placeholder="密码" autocomplete="off">
    <button onclick="checkPassword()">进入</button>
    <div class="auth-error" id="authError">密码错误</div>
  </div>
</div>

<!-- Main Content -->
<div id="mainContent">
<div class="wrap">
  <header>
    <a class="back-link" href="./index.html">
      <svg viewBox="0 0 24 24" width="16" height="16" style="fill:currentColor">
        <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
      </svg>
      返回主页
    </a>
    <h1>每日计划</h1>
    <div class="sub">记录每天的学习和工作安排</div>
  </header>

  <div class="plan-list">
    <a class="plan-item" href="./plan-2026-08-29.html">
      <div class="plan-date">2026-08-29 星期六</div>
      <div class="plan-summary">生成式软件工程课程 · 申论真题实战 · 运动</div>
    </a>

    <a class="plan-item" href="./plan-2026-08-28.html">
      <div class="plan-date">2026-08-28 星期五</div>
      <div class="plan-summary">考公战略复盘 · Deep Agent 虚拟文件系统实验</div>
    </a>
  </div>

  <footer>此页面供家人了解我的日常安排和学习进度</footer>
</div>
</div>

<script>
// Simple password protection - SHA256 hash
const HASH = '46d8dae1407acfe9cc3c0bc1c22bbba41000d4f51df51a95fe75220b4ec903c0';

async function hashPassword(pwd) {
  const encoder = new TextEncoder();
  const data = encoder.encode(pwd);
  const hashBuffer = await crypto.subtle.digest('SHA-256', data);
  const hashArray = Array.from(new Uint8Array(hashBuffer));
  return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
}

async function checkPassword() {
  const input = document.getElementById('passwordInput');
  const error = document.getElementById('authError');
  const pwd = input.value.trim();

  if (!pwd) {
    error.textContent = '请输入密码';
    error.classList.add('show');
    return;
  }

  const hash = await hashPassword(pwd);

  if (hash === HASH) {
    document.getElementById('authOverlay').classList.add('hidden');
    document.getElementById('mainContent').classList.add('show');
    sessionStorage.setItem('planAuth', 'ok');
  } else {
    error.textContent = '密码错误';
    error.classList.add('show');
    input.value = '';
    input.focus();
  }
}

// Check session storage on load
window.addEventListener('DOMContentLoaded', () => {
  if (sessionStorage.getItem('planAuth') === 'ok') {
    document.getElementById('authOverlay').classList.add('hidden');
    document.getElementById('mainContent').classList.add('show');
  }

  // Enter key to submit
  document.getElementById('passwordInput').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') checkPassword();
  });
});
</script>

</body>
</html>
