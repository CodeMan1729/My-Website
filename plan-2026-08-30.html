<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日计划 - 2026-08-30</title>
<link rel="icon" href="favicon.ico">
<style>
  :root{
    --bg:#12141a; --card:#1c1f28; --border:#2a2e3a;
    --text:#e8e9ed; --dim:#8b8f9c;
    --ok:#3ddc84; --warn:#ffb454; --bad:#ff5f5f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; padding:20px 16px; min-height:100vh;
    background:var(--bg); color:var(--text);
    font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  }

  #authOverlay {
    position:fixed; inset:0; z-index:9999;
    background:rgba(10,10,20,0.98);
    display:flex; align-items:center; justify-content:center;
    backdrop-filter:blur(8px);
  }
  #authOverlay.hidden { display:none; }

  .auth-box {
    background:var(--card); border:1px solid var(--border);
    border-radius:16px; padding:32px 28px; max-width:360px; width:90%;
    box-shadow:0 8px 32px rgba(0,0,0,0.4);
  }
  .auth-box h2 { margin:0 0 24px; font-size:22px; text-align:center; }
  .auth-box input {
    width:100%; padding:12px 14px; font-size:15px;
    background:var(--bg); border:1px solid var(--border);
    border-radius:8px; color:var(--text); outline:none;
    transition:border-color 0.2s;
  }
  .auth-box input:focus { border-color:var(--ok); }
  .auth-box button {
    width:100%; margin-top:16px; padding:12px;
    background:var(--ok); border:none; border-radius:8px;
    color:#fff; font-size:15px; font-weight:600; cursor:pointer;
    transition:opacity 0.2s;
  }
  .auth-box button:hover { opacity:0.9; }
  .auth-error {
    margin-top:12px; padding:10px; background:rgba(255,95,95,0.15);
    border:1px solid var(--bad); border-radius:6px;
    color:var(--bad); font-size:13px; text-align:center;
    display:none;
  }
  .auth-error.show { display:block; }

  #mainContent { display:none; }
  #mainContent.show { display:block; }

  .wrap{max-width:760px; margin:0 auto;}
  header h1{font-size:24px; margin:0 0 4px;}
  header .sub{color:var(--dim); font-size:13px;}
  header .back-link {
    display:inline-flex; align-items:center; gap:4px;
    margin-bottom:16px; padding:6px 12px;
    background:var(--card); border:1px solid var(--border);
    border-radius:8px; color:var(--dim);
    text-decoration:none; font-size:14px;
    transition:background 0.2s, color 0.2s;
  }
  header .back-link:hover { background:var(--border); color:var(--text); }

  .legend{display:flex; gap:16px; margin:16px 0 24px; font-size:12px; color:var(--dim); flex-wrap:wrap;}
  .legend span{display:inline-flex; align-items:center; gap:6px;}
  .dot{width:10px; height:10px; border-radius:50%; display:inline-block;}
  .timeline{position:relative; padding-left:16px; border-left:2px solid var(--border);}
  .task{
    background:var(--card); border:1px solid var(--border); border-radius:10px;
    padding:16px 18px; margin-bottom:14px; position:relative;
  }
  .task::before{
    content:""; position:absolute; left:-25px; top:20px;
    width:10px; height:10px; border-radius:50%; background:var(--dim);
  }
  .task.ok::before{background:var(--ok);}
  .task.warn::before{background:var(--warn);}
  .task.active::before{background:#4da3ff; box-shadow:0 0 0 4px rgba(77,163,255,0.2);}
  .row1{display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap;}
  .time{font-size:14px; font-weight:600; color:var(--dim); letter-spacing:0.5px;}
  .badges{display:flex; gap:6px; flex-wrap:wrap;}
  .badge{font-size:11px; padding:3px 9px; border-radius:999px; font-weight:600; white-space:nowrap;}
  .badge.ok{background:rgba(61,220,132,0.15); color:var(--ok);}
  .badge.warn{background:rgba(255,180,84,0.15); color:var(--warn);}
  .badge.bad{background:rgba(255,95,95,0.15); color:var(--bad);}
  .badge.active{background:rgba(77,163,255,0.15); color:#4da3ff;}
  .title{font-size:17px; font-weight:600; margin:10px 0 6px;}
  .notes{font-size:13px; color:var(--dim); line-height:1.6; white-space:pre-wrap;}
  .todo{margin-top:10px; font-size:12px; color:var(--warn); border-top:1px dashed var(--border); padding-top:10px;}
  footer{margin-top:24px; font-size:11px; color:var(--dim); text-align:center;}

  @media (max-width: 600px) {
    body { padding:16px 12px; }
    .wrap { padding:0; }
    header h1 { font-size:20px; }
    .time { font-size:13px; }
    .title { font-size:16px; }
    .notes { font-size:12px; }
    .badge { font-size:10px; padding:2px 7px; }
  }
</style>
</head>
<body>

<div id="authOverlay">
  <div class="auth-box">
    <h2>🔒</h2>
    <input type="password" id="passwordInput" placeholder="密码" autocomplete="off">
    <button onclick="checkPassword()">进入</button>
    <div class="auth-error" id="authError">密码错误</div>
  </div>
</div>

<div id="mainContent">
<div class="wrap">
  <header>
    <a class="back-link" href="./plan.html">
      <svg viewBox="0 0 24 24" width="16" height="16" style="fill:currentColor">
        <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
      </svg>
      返回计划列表
    </a>
    <h1>2026-08-30 星期日</h1>
    <div class="sub">每日战线记录</div>
  </header>

  <div class="legend">
    <span><span class="dot" style="background:var(--ok)"></span>已闭环</span>
    <span><span class="dot" style="background:var(--warn)"></span>部分完成/待办</span>
    <span><span class="dot" style="background:var(--bad)"></span>偏离计划</span>
    <span><span class="dot" style="background:#4da3ff"></span>进行中</span>
  </div>

  <div class="timeline" id="timeline"></div>

  <footer>此页面供家人了解我的日常安排和学习进度</footer>
</div>
</div>

<script>
async function checkPassword() {
  const input = document.getElementById('passwordInput');
  const error = document.getElementById('authError');
  const pwd = input.value.trim();

  if (!pwd) {
    error.textContent = '请输入密码';
    error.classList.add('show');
    return;
  }

  try {
    const success = await checkPasswordAndDecrypt(
      pwd,
      'encryptedTimeline',
      'timeline',
      'timeline-2026-08-30'
    );

    if (success) {
      document.getElementById('authOverlay').classList.add('hidden');
      document.getElementById('mainContent').classList.add('show');
      sessionStorage.setItem('planAuth', 'ok');
    } else {
      error.textContent = '密码错误';
      error.classList.add('show');
      input.value = '';
      input.focus();
    }
  } catch (e) {
    error.textContent = '解密失败: ' + e.message;
    error.classList.add('show');
  }
}

window.addEventListener('DOMContentLoaded', () => {
  if (sessionStorage.getItem('planAuth') === 'ok') {
    const cached = sessionStorage.getItem('timeline-2026-08-30');
    if (cached) {
      document.getElementById('timeline').innerHTML = cached;
      document.getElementById('authOverlay').classList.add('hidden');
      document.getElementById('mainContent').classList.add('show');
    }
  }

  document.getElementById('passwordInput').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') checkPassword();
  });
});
</script>

</html>
