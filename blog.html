<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Blog - Caleb XXY</title>
    <link rel="icon" href="favicon.ico">
    <meta name="description" content="Caleb's blog">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="./static/css/blog.css">

    <script>
        (function() {
            var theme = document.cookie.match(/themeState=([^;]+)/);
            if (theme && theme[1] === "Dark") {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
</head>

<body>
    <div class="container">
        <header class="blog-header">
            <a class="back-link" href="./index.html">
                <svg viewBox="0 0 24 24" width="20" height="20">
                    <path fill="currentColor" d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
                </svg>
                Back
            </a>
            <h1 class="blog-title">Blog</h1>
        </header>

        <div class="post-list" id="postList">
            <div class="post-placeholder">Loading posts...</div>
        </div>
    </div>

    <script defer src="./static/js/blog.js"></script>
</body>

</html>
